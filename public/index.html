<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    /* #planner is the console frame — one continuous marble surface flush
       against the header above and the viewport edges. Reference: EQ's
       classic UI (wiki.project1999.com/File:Classic_Full_Screen_UI.jpg)
       doesn't make everything flush and borderless — the macro-button
       cluster and the WHO/INVITE cluster each sit in their own distinctly
       beveled panel, inset from the console around them by a small honest
       gap. What's flush is *within* a cluster: individual buttons pack
       edge-to-edge, sharing a border instead of a gap, each still reading
       as its own beveled block. .controls-panel and the zone-card list
       follow that split: panel-level gap between the two clusters, zero
       gap + shared borders between repeated items inside each. Scoped to
       index.html only — .controls-panel/.zone-card aren't used elsewhere,
       and the shared theme.css floating-panel treatment is still correct
       for route.html/class-browser.html's .filter-bar etc. */
    /* #planner's marble is the page-level backdrop, not a card's own
       surface — on wide layouts the *document* scrolls (not an inner
       #results container; #planner uses overflow:visible there so the
       sticky sidebar/status-panel work), so without this the texture
       visibly slides past as you scroll, instead of reading as one still
       stone slab you're scrolling a sheet of cards over. Fixed only on
       the marble-tex layer (not the lit-top/shaded-bottom gradient after
       it) — the gradient still tracks #planner's own box, since that's
       meant to shade this one panel's actual top/bottom edges, not repeat
       every viewport height. Cards (.zone-card, .controls-panel,
       .status-panel) keep their own default-attachment backgrounds — each
       is a physical object that should carry its surface with it as it
       moves, unlike the backdrop behind/between them. */
    #planner {
      display: flex; flex-direction: column; overflow: hidden; flex: 1;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      background-attachment: fixed, scroll;
      padding: 0 14px 14px; gap: 14px;
    }
    #results { flex: 1; min-height: 0; overflow-y: auto; }

    .controls-panel, .status-panel {
      flex-shrink: 0; overflow: hidden;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      border: 4px solid;
      border-color: var(--edge-hi) var(--edge-lo) var(--edge-lo) var(--edge-hi);
      border-radius: 3px;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.08), inset -1px -1px 0 rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    /* .planner-controls layout is shared (theme.css) — see the "Sidebar
       filter panel" rule there. */

    /* Status panel: the vitals-bar-plus-action-buttons cluster, its own
       console module echoing the reference client's right-side column
       (portrait/bars up top, WHO/INVITE/etc. buttons below). Empty
       (innerHTML = "") between plans, so it collapses to nothing rather
       than showing an empty bevel box. */
    .status-panel:empty { display: none; }
    /* All results metadata (counts, level range, faction warnings) lives
       here now — #results holds only the zone-card list, no header/divider
       of its own above it. */
    .status-meta {
      padding: 14px 20px; text-align: center; font-size: 12px; color: var(--ink-muted);
      line-height: 1.5; border-bottom: 2px solid var(--edge-lo);
    }
    .status-warnings { margin-top: 4px; font-size: 11px; }
    .status-summary { padding: 16px 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .status-summary .mana-bar { width: 100%; }
    .status-owned-count { font-size: 12px; color: var(--ink-muted); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
    /* .macro-socket/.macro-btn component styling lives in theme.css. */
    .status-actions {
      display: flex; justify-content: center;
      padding: 12px 20px 16px; border-top: 2px solid var(--edge-lo);
    }

    /* .field/.field label/.field select,input/.panel-actions layout are
       shared (theme.css) — this page only adds its own range-picker field. */
    .field .range-picker { flex: 1; min-width: 0; }

    /* The deeper input bevel (border-width 4px, heavier inset shadow) now
       lives directly in theme.css's shared .field select/.field input/
       .tag-wrap rule, propagated there after landing here first — no
       page-specific override needed anymore. */

    .range-picker { display: flex; align-items: center; gap: 10px; }
    .range-picker input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 90px; height: 3px;
      background: var(--line); border-radius: 2px; cursor: pointer;
      border: none; box-shadow: none; padding: 0;
    }
    .range-picker input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: radial-gradient(circle at 35% 30%, #ffd97a, #c98f1f 60%, #8a5f10);
      border-radius: 50%; cursor: pointer;
    }
    .range-picker input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .range-display { font-size: 14px; color: var(--gold); font-weight: 700; white-space: nowrap; min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }

    /* .text-action (plain muted text links, e.g. Show all/Clear owned/Reset
       filters) now lives in theme.css — shared by all three pages. */

    /* Zone rows: each one keeps a full, pronounced bevel border (its own
       beveled box, not a flat divided row) but packs directly against its
       neighbors — a negative margin overlaps each row's top border onto
       the previous row's bottom border, one shared seam instead of two
       stacked ones, the same way adjacent macro buttons in the reference
       share an edge without a gap between them. */
    .zone-card {
      position: relative;
      margin: 0; padding: 14px 20px;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      border: 4px solid;
      border-color: var(--edge-hi) var(--edge-lo) var(--edge-lo) var(--edge-hi);
      border-radius: 3px;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.08), inset -1px -1px 0 rgba(0, 0, 0, 0.45);
    }
    .zone-card + .zone-card { margin-top: -4px; }
    /* Faction is the LED dot's job now, not the box color — neutralize
       theme.css's colored border-top/background-tint per faction so the
       card's own bevel stays a plain stone plate on every row. */
    .zone-card.safe, .zone-card.neutral, .zone-card.wont_sell, .zone-card.kos {
      border-color: var(--edge-hi) var(--edge-lo) var(--edge-lo) var(--edge-hi);
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
    }
    .zone-card-header { margin-bottom: 12px; }
    .zone-name { position: relative; padding-left: 17px; }
    .zone-name::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 9px; height: 9px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8b4c8, #6e6885 65%, #4a4658);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
    }
    .zone-card.safe      .zone-name::before { background: radial-gradient(circle at 35% 30%, #7dffb0, #22c55e 60%, #157a3c); box-shadow: 0 0 6px rgba(34, 197, 94, 0.75), inset 0 0 2px rgba(0, 0, 0, 0.4); }
    .zone-card.neutral   .zone-name::before { background: radial-gradient(circle at 35% 30%, #ffd97a, #f59e0b 60%, #9a5f05); box-shadow: 0 0 6px rgba(245, 158, 11, 0.75), inset 0 0 2px rgba(0, 0, 0, 0.4); }
    .zone-card.wont_sell .zone-name::before { background: radial-gradient(circle at 35% 30%, #ffb37a, #f97316 60%, #9a3f05); box-shadow: 0 0 6px rgba(249, 115, 22, 0.75), inset 0 0 2px rgba(0, 0, 0, 0.4); }
    .zone-card.kos       .zone-name::before { background: radial-gradient(circle at 35% 30%, #ff8a8a, #ef4444 60%, #7a1515); box-shadow: 0 0 6px rgba(239, 68, 68, 0.9), inset 0 0 2px rgba(0, 0, 0, 0.4); }
    /* Route: plain stone text, not the parchment scroll treatment —
       .spell-scroll below is this page's focus content, the route is
       wayfinding detail. Route-label/-steps/-zone/-sep/-boat-sep/
       -translocator-sep are theme.css's parchment-tuned colors (dark ink
       for a light background); overridden here for a dark stone one. */
    /* Bold serif at small sizes reads cramped on this dark, busy marble
       texture — bumped size back up to 13px (matching the parchment
       version's own size rather than shrinking it further), added
       letter-spacing and a wider flex gap so multi-word zone names
       (e.g. "Steamfont Mountains") don't run into their own neighbors,
       and dropped the weight from bold to 600 since true bold Georgia's
       tight counters were most of the cramped feeling. */
    .zone-route { margin-bottom: 12px; }
    .zone-route .route-label { color: var(--ink-muted); text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6); }
    .zone-route .route-steps { color: var(--parchment); font-size: 13px; line-height: 2; letter-spacing: 0.055em; gap: 6px; }
    .zone-route .route-zone { color: var(--parchment); font-weight: 600; }
    .zone-route .route-sep, .zone-route .boat-sep, .zone-route .translocator-sep { margin: 0; }
    .zone-route .route-sep { color: var(--gold); }
    .zone-route .boat-sep { color: #7ba7f5; }
    .zone-route .translocator-sep { color: #c4a3f7; }
    .spell-scroll { margin-top: 12px; }
    .spell-vendor-list { display: flex; flex-direction: column; gap: 8px; }

    /* Wide layout: sidebar. The sidebar column fills its full allocated
       width — left bevel flush against the screen edge (no padding
       outside it), right bevel flush against the results seam (no gap
       to results, sidebar's own right border *is* the seam) — rather
       than floating with a margin on both sides within the console. */
    @media (min-width: 1100px) {
      #planner { flex-direction: row; align-items: flex-start; overflow: visible; padding: 0 0 14px 0; gap: 0; }
      /* width/position/sticky and the .field column-flip are shared
         (theme.css) — this page only needs its own 3-column `order`. */
      .controls-panel { order: 0; }

      #results { overflow-y: auto; order: 1; }

      /* Status panel sits to the right of results on desktop (DOM order
         puts it right after .controls-panel, for mobile's stacking —
         `order` reflows it to last here without duplicating markup). Fills
         its column the same way the sidebar does: left bevel shares the
         results seam (no gap, gap:0 on #planner), right bevel shares the
         screen's own edge (no padding outside it, #planner's right padding
         removed above). */
      .status-panel {
        width: 220px; min-width: 220px; flex-shrink: 0;
        position: sticky; top: 0;
        order: 2;
      }
    }

    /* Below the sidebar breakpoint: one page-level scroll area instead of a
       fixed controls panel + independently scrolling results pane. */
    @media (max-width: 1099.98px) {
      body { height: auto; min-height: 100vh; }
      #planner { flex: none; overflow: visible; }
      #results { flex: none; overflow-y: visible; min-height: 0; }
    }

    /* Narrow: stack vertically */
    @media (max-width: 700px) {
      #planner { padding: 0 10px 10px; gap: 10px; }
      .planner-controls { gap: 12px; padding: 14px 16px; }
      .control-sep { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Spell Finder</p>
    </div>
    <nav class="nav-links" id="nav-links"></nav>
  </header>

  <div id="planner">
    <div id="controls-panel-slot"></div>
    <div id="status-panel" class="status-panel"></div>
    <div id="results"></div>
  </div>

  <div id="class-suggestions" class="tag-dropdown" role="listbox" aria-label="Class suggestions"></div>
  <div id="spellline-suggestions" class="tag-dropdown" role="listbox" aria-label="Spell line suggestions"></div>
  <div id="spell-suggestions" class="tag-dropdown" role="listbox" aria-label="Spell suggestions"></div>
  <div id="zone-suggestions" class="tag-dropdown" role="listbox" aria-label="Zone suggestions"></div>
  <div id="spell-tooltip" role="tooltip" aria-hidden="true"></div>
  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
