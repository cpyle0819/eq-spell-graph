<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    #planner { padding: 24px 28px 0; display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    #results { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; padding-right: 20px; }

    .controls-panel { margin-bottom: 24px; overflow: hidden; flex-shrink: 0; }
    .planner-controls { display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; }

    .field { display: flex; align-items: center; gap: 10px; }
    .field label { min-width: 100px; }
    .field select, .field input { flex: 1; min-width: 0; }
    .field .range-picker { flex: 1; min-width: 0; }

    .range-picker { display: flex; align-items: center; gap: 10px; }
    .range-picker input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 90px; height: 3px;
      background: var(--line); border-radius: 2px; cursor: pointer;
      border: none; box-shadow: none; padding: 0;
    }
    .range-picker input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: radial-gradient(circle at 35% 30%, #ffd97a, #c98f1f 60%, #8a5f10);
      border-radius: 50%; cursor: pointer;
    }
    .range-picker input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .range-display { font-size: 14px; color: var(--gold); font-weight: 700; white-space: nowrap; min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }

    .results-header { margin-bottom: 20px; }
    .zone-card { padding: 18px 22px; margin-bottom: 14px; }
    .zone-card-header { margin-bottom: 12px; }
    .route-path { margin-top: 14px; margin-bottom: 16px; }
    .spell-vendor-list { display: flex; flex-direction: column; gap: 8px; }

    /* Wide layout: sidebar */
    @media (min-width: 1100px) {
      #planner { flex-direction: row; padding: 24px 28px; gap: 24px; align-items: flex-start; overflow: visible; }
      .controls-panel { width: 300px; min-width: 300px; flex-shrink: 0; margin-bottom: 0; position: sticky; top: 24px; }
      .field label { min-width: 0; width: 100%; }
      .field { flex-direction: column; align-items: stretch; gap: 4px; }

      #results { overflow-y: auto; padding-bottom: 0; padding-right: 16px; }
    }

    /* Below the sidebar breakpoint: one page-level scroll area instead of a
       fixed controls panel + independently scrolling results pane. */
    @media (max-width: 1099.98px) {
      body { height: auto; min-height: 100vh; }
      #planner { flex: none; overflow: visible; }
      #results { flex: none; overflow-y: visible; min-height: 0; padding-right: 0; }
    }

    /* Narrow: stack vertically */
    @media (max-width: 700px) {
      #planner { padding: 14px 16px 0; }
      .planner-controls { gap: 12px; padding: 14px 16px; }
      .control-sep { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Spell Finder</p>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="spells.html">Spell Browser</a>
      <a class="nav-link" href="route.html">Route Finder</a>
    </nav>
  </header>

  <div id="planner">
    <div class="controls-panel">
    <div class="planner-controls">
      <div class="field">
        <label>Race</label>
        <select id="race-select">
          <option value="barbarian">Barbarian</option>
          <option value="dark elf">Dark Elf</option>
          <option value="dwarf">Dwarf</option>
          <option value="erudite">Erudite</option>
          <option value="gnome">Gnome</option>
          <option value="half elf">Half Elf</option>
          <option value="halfling">Halfling</option>
          <option value="high elf">High Elf</option>
          <option value="human">Human</option>
          <option value="iksar">Iksar</option>
          <option value="ogre">Ogre</option>
          <option value="troll">Troll</option>
          <option value="wood elf">Wood Elf</option>
        </select>
      </div>
      <div class="field">
        <label>Primary Class</label>
        <select id="primary-class-select">
          <option value="bard">Bard</option>
          <option value="beastlord">Beastlord</option>
          <option value="cleric">Cleric</option>
          <option value="druid">Druid</option>
          <option value="enchanter">Enchanter</option>
          <option value="magician">Magician</option>
          <option value="monk">Monk</option>
          <option value="necromancer">Necromancer</option>
          <option value="paladin">Paladin</option>
          <option value="ranger">Ranger</option>
          <option value="rogue">Rogue</option>
          <option value="shadow knight">Shadow Knight</option>
          <option value="shaman" selected>Shaman</option>
          <option value="warrior">Warrior</option>
          <option value="wizard">Wizard</option>
        </select>
      </div>
      <div class="field">
        <label>Deity</label>
        <select id="deity-select">
          <option value="agnostic">Agnostic</option>
          <option value="bertoxxulous">Bertoxxulous</option>
          <option value="brell serilis">Brell Serilis</option>
          <option value="bristlebane">Bristlebane</option>
          <option value="cazic-thule">Cazic-Thule</option>
          <option value="erollisi marr">Erollisi Marr</option>
          <option value="innoruuk">Innoruuk</option>
          <option value="karana">Karana</option>
          <option value="mithaniel marr">Mithaniel Marr</option>
          <option value="prexus">Prexus</option>
          <option value="quellious">Quellious</option>
          <option value="rallos zek">Rallos Zek</option>
          <option value="rodcet nife">Rodcet Nife</option>
          <option value="solusek ro">Solusek Ro</option>
          <option value="the tribunal" selected>The Tribunal</option>
          <option value="tunare">Tunare</option>
          <option value="veeshan">Veeshan</option>
        </select>
      </div>
      <div class="control-sep" aria-hidden="true"></div>
      <div class="field">
        <label>Spell Class</label>
        <div class="tag-wrap" id="class-tag-wrap">
          <div class="tag-list" id="class-tags"></div>
          <input type="text" id="class-search-input" class="tag-search-input" placeholder="Search to add..." autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label>Specific Spells</label>
        <div class="tag-wrap" id="spell-tag-wrap">
          <div class="tag-list" id="spell-tags"></div>
          <input type="text" id="spell-search-input" class="tag-search-input" placeholder="Search to add..." autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label>Specific Zones</label>
        <div class="tag-wrap" id="zone-tag-wrap">
          <div class="tag-list" id="zone-tags"></div>
          <input type="text" id="zone-search-input" class="tag-search-input" placeholder="Search to add..." autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="field">
        <label>Current Zone</label>
        <select id="zone-input">
          <option value="">-- Select Zone --</option>
        </select>
      </div>
      <div class="field">
        <label>Levels</label>
        <div class="range-picker">
          <input type="range" id="level-min" min="1" max="50" value="1">
          <span class="range-display" id="range-display">1 – 10</span>
          <input type="range" id="level-max" min="1" max="50" value="10">
        </div>
      </div>
    </div>
    </div><!-- .controls-panel -->
    <div id="results"></div>
  </div>

  <div id="class-suggestions" class="tag-dropdown" role="listbox" aria-label="Class suggestions"></div>
  <div id="spell-suggestions" class="tag-dropdown" role="listbox" aria-label="Spell suggestions"></div>
  <div id="zone-suggestions" class="tag-dropdown" role="listbox" aria-label="Zone suggestions"></div>
  <div id="spell-tooltip" role="tooltip" aria-hidden="true"></div>
  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="app.js"></script>
</body>
</html>
