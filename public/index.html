<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EQ Spell Planner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; color: #e94560; }
    .tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .tab {
      padding: 6px 14px;
      background: #0f3460;
      border: 1px solid #533483;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #aaa;
    }
    .tab.active { background: #533483; color: #fff; }
    .panel { display: none; flex: 1; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }

    /* Planner */
    #planner { padding: 20px; overflow-y: auto; }
    .planner-controls {
      display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
      margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #0f3460;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: #888; }
    .field select, .field input {
      background: #0f3460; border: 1px solid #533483; color: #eee;
      padding: 6px 10px; border-radius: 4px; font-size: 14px;
    }
    .field input[type="text"] { width: 200px; }
    .range-picker { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
    .range-picker input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: #0f3460; border-radius: 3px; outline: none;
    }
    .range-picker input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: #e94560; border-radius: 50%; cursor: pointer;
    }
    .range-labels { font-size: 13px; color: #e94560; text-align: center; font-weight: 600; }
    button {
      padding: 8px 16px; background: #e94560; border: none; color: #fff;
      border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;
    }
    button:hover { background: #c73e54; }

    /* Results */
    .results-header { font-size: 14px; color: #aaa; margin-bottom: 12px; }
    .zone-card {
      background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
      padding: 14px 18px; margin-bottom: 12px;
    }
    .zone-card-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .zone-name { font-size: 16px; font-weight: 600; color: #e94560; }
    .zone-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: #533483; color: #ddd;
    }
    .zone-badge.hops { background: #0f3460; }
    .spell-vendor-list { display: flex; flex-direction: column; gap: 6px; }
    .spell-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spell-chip {
      font-size: 12px; padding: 3px 8px; border-radius: 4px;
      background: #1a1a2e; border: 1px solid #533483; color: #ccc;
      white-space: nowrap;
    }
    .spell-chip .lvl { color: #888; margin-left: 4px; }
    .vendor-names { display: flex; flex-wrap: wrap; gap: 4px; }
    .vendor-tag {
      font-size: 11px; padding: 2px 6px; border-radius: 3px;
      background: #0f3460; color: #8ab4f8;
    }
    .zone-card.kos { opacity: 0.4; border-color: #661020; }
    .zone-card.kos .zone-name { color: #993040; }
    .zone-card.wont_sell { opacity: 0.7; border-color: #664420; }
    .zone-card.wont_sell .zone-name { color: #cc8833; }
    .zone-card.neutral { border-color: #555; }
    .faction-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; text-transform: uppercase; font-weight: 600; }
    .faction-badge.safe { background: #1a4d2e; color: #4ade80; }
    .faction-badge.neutral { background: #4a4520; color: #fbbf24; }
    .faction-badge.wont_sell { background: #4d3a1a; color: #f59e0b; }
    .faction-badge.kos { background: #4d1a1a; color: #f87171; }
    .no-results { color: #666; font-style: italic; padding: 40px 0; text-align: center; }

    /* Spell detail */
    .spell-detail {
      background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
      padding: 14px 18px; margin-bottom: 12px;
    }
    .spell-detail h3 { color: #e94560; margin-bottom: 8px; }
    .vendor-row { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; color: #ccc; }
    .vendor-row .zone-tag { color: #888; }

    /* Graph tab */
    #graph-panel { position: relative; }
    #cy { flex: 1; }

  </style>
</head>
<body>
  <header>
    <h1>EQ Spell Planner</h1>
    <div class="tabs">
      <div class="tab active" data-panel="planner">Planner</div>
      <div class="tab" data-panel="spells-panel">Spells</div>
      <div class="tab" data-panel="graph-panel">Graph</div>
    </div>
  </header>

  <!-- Planner Panel -->
  <div id="planner" class="panel active">
    <div class="planner-controls">
      <div class="field">
        <label>Race</label>
        <select id="race-select">
          <option value="barbarian">Barbarian</option>
          <option value="dark elf">Dark Elf</option>
          <option value="dwarf">Dwarf</option>
          <option value="erudite">Erudite</option>
          <option value="gnome">Gnome</option>
          <option value="half elf">Half Elf</option>
          <option value="halfling">Halfling</option>
          <option value="high elf">High Elf</option>
          <option value="human">Human</option>
          <option value="iksar">Iksar</option>
          <option value="ogre">Ogre</option>
          <option value="troll">Troll</option>
          <option value="wood elf">Wood Elf</option>
        </select>
      </div>
      <div class="field">
        <label>Primary Class</label>
        <select id="primary-class-select">
          <option value="bard">Bard</option>
          <option value="beastlord">Beastlord</option>
          <option value="cleric">Cleric</option>
          <option value="druid">Druid</option>
          <option value="enchanter">Enchanter</option>
          <option value="magician">Magician</option>
          <option value="monk">Monk</option>
          <option value="necromancer">Necromancer</option>
          <option value="paladin">Paladin</option>
          <option value="ranger">Ranger</option>
          <option value="rogue">Rogue</option>
          <option value="shadow knight">Shadow Knight</option>
          <option value="shaman" selected>Shaman</option>
          <option value="warrior">Warrior</option>
          <option value="wizard">Wizard</option>
        </select>
      </div>
      <div class="field">
        <label>Deity</label>
        <select id="deity-select">
          <option value="agnostic">Agnostic</option>
          <option value="bertoxxulous">Bertoxxulous</option>
          <option value="brell serilis">Brell Serilis</option>
          <option value="bristlebane">Bristlebane</option>
          <option value="cazic-thule">Cazic-Thule</option>
          <option value="erollisi marr">Erollisi Marr</option>
          <option value="innoruuk">Innoruuk</option>
          <option value="karana">Karana</option>
          <option value="mithaniel marr">Mithaniel Marr</option>
          <option value="prexus">Prexus</option>
          <option value="quellious">Quellious</option>
          <option value="rallos zek">Rallos Zek</option>
          <option value="rodcet nife">Rodcet Nife</option>
          <option value="solusek ro">Solusek Ro</option>
          <option value="the tribunal" selected>The Tribunal</option>
          <option value="tunare">Tunare</option>
          <option value="veeshan">Veeshan</option>
        </select>
      </div>
      <div class="field">
        <label>Shopping For (class)</label>
        <select id="class-select"></select>
      </div>
      <div class="field">
        <label>Current Zone</label>
        <select id="zone-input">
          <option value="">-- Select Zone --</option>
        </select>
      </div>
      <div class="field">
        <label>Level Range</label>
        <div class="range-picker">
          <input type="range" id="level-min" min="1" max="50" value="1">
          <input type="range" id="level-max" min="1" max="50" value="10">
          <div class="range-labels">
            <span id="range-display">1 – 10</span>
          </div>
        </div>
      </div>
      <button id="plan-btn">Plan Route</button>
    </div>
    <div id="results"></div>
  </div>

  <!-- Spells List Panel -->
  <div id="spells-panel" class="panel">
    <div style="padding: 20px; overflow-y: auto; flex: 1;">
      <div class="planner-controls">
        <div class="field">
          <label>Class</label>
          <select id="spell-class-select"></select>
        </div>
        <div class="field">
          <label>Level</label>
          <select id="spell-level-select">
            <option value="all">All</option>
          </select>
        </div>
        <div class="field">
          <label>Search</label>
          <input type="text" id="spell-search" placeholder="spell name...">
        </div>
      </div>
      <div id="spell-results"></div>
    </div>
  </div>

  <!-- Graph Panel -->
  <div id="graph-panel" class="panel">
    <div id="cy"></div>
  </div>

  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
