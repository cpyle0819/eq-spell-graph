<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Tradeskills</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Norraph — Tradeskills">
  <meta property="og:description" content="Norraph is an interactive wiki for EverQuest Legends: six tools sharing one faction-aware graph, each surfacing a direct, filtered answer instead of a wiki page you'd have to read in full.">
  <meta property="og:image" content="https://norraph.com/og-image.png">
  <meta property="og:url" content="https://norraph.com/trades.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style id="page-style">
    /* Page layout only — component styling lives in theme.css. Structure
       mirrors quests.html/class-browser.html/maps.html's console-frame +
       left sidebar-panel exactly: filters live in <sidebar-panel>, the
       dossier packs the content column. */
    body { height: 100vh; display: flex; flex-direction: column; }

    #trades-page {
      display: flex; flex-direction: column; overflow: hidden; flex: 1;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      padding: 0 14px 14px; gap: 14px;
    }
    #trades-content { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 0 0 24px; --gutter-w: 0px; }
    /* scrollbar-gutter: stable always reserves the scrollbar's width, even
       when nothing overflows (mobile: harmless no-op, since #trades-content
       is overflow-y: visible there) -- on desktop that reserved strip sits
       between #trades-results and shopping-list-panel and reads as a stray
       gap keeping them from touching. Same --gutter-w bleed-back trick as
       index.html's #results > * (app.js's syncResultsGutterWidth measures
       the real offsetWidth/clientWidth delta into this custom property). */
    #trades-results { width: calc(100% + var(--gutter-w)); margin-right: calc(-1 * var(--gutter-w)); }

    @media (min-width: 1100px) {
      #trades-page { flex-direction: row; align-items: flex-start; overflow: visible; padding: 0 0 14px 0; gap: 0; }
      /* width/position/sticky are owned by sidebar-panel/shopping-list-panel
         themselves -- this page only needs its own 3-column `order`, same
         split index.html makes for sidebar-panel/status-panel. renderSidebar()
         replaces #controls-panel-slot's own outerHTML with <sidebar-panel>,
         so the order rule targets that tag directly, not the slot div. */
      sidebar-panel { order: 0; }
      /* No top/left inset here, deliberately -- #trades-results (the
         leveling guide / recipe / ingredient cards) should touch the
         header above and sidebar-panel/shopping-list-panel to the sides
         flush, same convention as index.html's sidebar/results seam
         ("sidebar's own right border *is* the seam"); sidebar-panel and
         shopping-list-panel already sit flush against the header the same
         way (#trades-page's own top padding is 0 here). */
      #trades-content { overflow-y: auto; order: 1; padding: 0 0 24px 0; }
      shopping-list-panel { order: 2; }
    }

    @media (max-width: 1099.98px) {
      body { height: auto; min-height: 100vh; }
      #trades-page { flex: none; overflow: visible; }
      #trades-content { flex: none; overflow-y: visible; min-height: 0; }
    }

    @media (max-width: 700px) {
      #trades-page { padding: 0 10px 10px; gap: 10px; }
    }

    .no-results { padding: 40px 20px; text-align: center; color: var(--ink-muted); font-size: 14px; }

    /* Leveling Guide and Browse (recipes/ingredients) are mutually
       exclusive views selected by #trade-view-select (sidebar-panel,
       renderSidebar() in trades.js) -- only one ever renders into
       #trades-results at a time, so there's no seam to manage between them
       the way card-list rows need (decisions/
       card-list-seams-no-border-overlap.md still governs that, just within
       whichever single list is showing). */
  </style>
</head>
<body>
  <app-header subtitle="Tradeskills" beta>
    <nav-links slot="nav" current="trades"></nav-links>
  </app-header>

  <div id="trades-page">
    <div id="controls-panel-slot"></div>
    <div id="trades-content">
      <div id="trades-results"></div>
    </div>
    <shopping-list-panel id="shopping-list-panel"></shopping-list-panel>
  </div>

  <detail-tooltip id="detail-tooltip" role="tooltip" aria-hidden="true"></detail-tooltip>
  <nearest-vendors-dialog id="nearest-vendors-dialog"></nearest-vendors-dialog>
  <app-footer></app-footer>
  <script type="module" src="router.js"></script>
</body>
</html>
