<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Maps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style id="page-style">
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    /* main is the console frame — flush against the header and the
       viewport edges, matching the Spell Finder's #planner (same
       sidebar-panel + results split, just two columns instead of three —
       see decisions/sidebar-filter-panel-shared.md). On wide layouts below
       main also switches to overflow: visible so the sidebar can stick,
       which means the *document* scrolls rather than an inner container --
       same situation #planner solved in decisions/
       planner-marble-backdrop-background-attachment-fixed.md, and the same
       fix: fixed-attachment marble so it keeps covering the page past
       main's own (viewport-sized) box instead of running out and exposing
       the footer behind tall content (e.g. a zone with a long bestiary). */
    main {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      background-attachment: fixed, scroll;
      padding: 0 14px 14px; gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field select { width: 100%; }

    /* The route panel is always the narrow sidebar-panel column now (not
       just past some overflow threshold), so From/every stop/To simply
       stack full-width in DOM order -- no horizontal chain, no gap-add-btn
       between fields, no width measurement to decide when to wrap. Adding
       a stop always appends after the last field (#add-stop-btn); removing
       one is still each stop-field's own inline × (below). */
    .route-chain { display: flex; flex-direction: column; gap: 10px; }
    #chain-middle { display: contents; }

    /* A stop's label row carries its own remove action inline (not a
       separate button-shaped element next to the field) -- same
       "secondary, infrequent" .text-action treatment app.js/quests.js
       already use for Show all/Clear owned, not a bone-plate macro-button,
       since removing one stop out of several is a fine-grained edit, not a
       primary action on par with Reset. */
    .stop-field .field-label-row { display: flex; align-items: baseline; gap: 8px; }

    #add-stop-btn { align-self: flex-start; white-space: nowrap; }

    /* Feature buttons (Ports / Avoid Danger / Reset): full-width,
       stacked, same nav-row bevel via macro-button's `full` variant
       (decisions/macro-button-shared-component.md) instead of the old
       bulky square pair. */
    .panel-buttons { display: flex; flex-direction: column; gap: 8px; }

    /* Once a destination is chosen, up to two beveled objects stack here —
       route-card (the "how do I get there," only once a starting zone is
       also picked) above zone-dossier (the "what's actually there," which
       only needs a destination). Real gap between them, same "distinct
       panels, not repeated list rows" reasoning as sidebar-panel above. */
    #route-result { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; display: flex; flex-direction: column; gap: 14px; }
    /* route-card/zone-dossier each own their own layout (public/components/). */

    /* The true "nothing picked yet" state is .no-results' only child here —
       every other outcome (a route, a notice-plus-dossier) always ends with
       a zone-dossier appended alongside it (see maps.js's runRoute()), so
       :has(> .no-results:only-child) can't accidentally match those. Without
       this, the single line of text sits pinned to the top of this whole
       flex:1 area, which on a tall viewport reads as a mostly-empty page
       rather than a deliberate landing message. */
    #route-result:has(> .no-results:only-child) { justify-content: center; }

    /* A short inline notice ("you're already there" / "no route found")
       that still leaves room for zone-dossier below it — unlike the
       centered, padded .no-results used when nothing is selected at all. */
    .no-results.compact { padding: 4px 2px 0; text-align: left; }

    /* Wide layout: sidebar-panel sits left, route-result to its right --
       same split/order convention as index.html's #planner (sidebar-panel
       owns its own width/sticky/border). body switches from a fixed
       height: 100vh to height: auto here (same as the narrow breakpoint
       below already does) -- with a fixed-height body, main's own
       flex: 1 box is capped at one screen tall, so overflow: visible just
       lets #route-result's content spill past main's box uncovered by its
       marble background rather than actually growing main to contain it.
       That showed up as the page background (near-black) visible behind
       any column shorter than the tallest one once you scrolled past
       main's capped height -- most visibly on the left, since
       sidebar-panel is far shorter than a long zone-dossier. auto height
       lets main size to its tallest child like it already does on narrow
       viewports, so the marble genuinely covers the full scrolled area on
       both sides. */
    @media (min-width: 1100px) {
      body { height: auto; min-height: 100vh; }
      main { flex-direction: row; align-items: flex-start; overflow: visible; padding: 0 0 14px 0; gap: 0; }
      sidebar-panel { order: 0; }
      #route-result { overflow-y: auto; order: 1; }
    }
    @media (max-width: 1099.98px) {
      body { height: auto; min-height: 100vh; }
      main { flex: none; overflow: visible; }
      #route-result { flex: none; overflow-y: visible; min-height: 0; }
    }
    @media (max-width: 700px) {
      main { padding: 0 10px 10px; gap: 10px; }
    }
  </style>
</head>
<body>
  <app-header subtitle="Maps">
    <nav-links slot="nav" current="maps"></nav-links>
  </app-header>

  <main>
    <sidebar-panel>
      <div class="route-chain" id="route-chain">
        <div class="field">
          <label>From</label>
          <select id="route-from"><option value="">— Select Zone —</option></select>
        </div>
        <div id="chain-middle"></div>
        <div class="field">
          <label>To</label>
          <select id="route-to"><option value="">— Select Zone —</option></select>
        </div>
      </div>
      <button type="button" class="text-action" id="add-stop-btn" title="Add a stop to the end of the route">+ Add Stop</button>
      <div class="panel-buttons">
        <macro-button full id="ports-btn" title="Let a Wizard- or Druid-only teleport spell (e.g. Alter Plane: Sky, Circle of Toxxulia) count as a 1-hop route">Ports</macro-button>
        <macro-button full id="avoid-danger-btn" title="Prefer a less dangerous route over the shortest one, within a couple extra hops">Avoid Danger</macro-button>
        <macro-button full id="reset-route-btn">Reset</macro-button>
      </div>
    </sidebar-panel>
    <div id="route-result"></div>
  </main>

  <detail-tooltip id="detail-tooltip" role="tooltip" aria-hidden="true"></detail-tooltip>
  <app-footer></app-footer>
  <script type="module" src="router.js"></script>
</body>
</html>
