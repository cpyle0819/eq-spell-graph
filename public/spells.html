<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Spell Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    footer a { color: #c8a860; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141210;
      color: #f0e4c8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    header {
      padding: 14px 28px;
      background: #1a1610;
      border-bottom: 1px solid #3a2e18;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header-title { display: flex; flex-direction: column; gap: 3px; }
    header h1 { font-size: 22px; font-weight: 800; color: #e8a82a; letter-spacing: -0.01em; }
    .header-sub { font-size: 11px; color: #6a5438; letter-spacing: 0.18em; text-transform: uppercase; }

    .nav-link {
      padding: 8px 18px; background: transparent;
      border: 1px solid #3a2e18; border-radius: 6px;
      font-size: 12px; color: #8a6838; text-decoration: none;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500;
      transition: all 150ms ease-out; margin-left: auto;
    }
    .nav-link:hover { border-color: #5a4828; color: #c8a860; background: rgba(200,168,42,0.06); }

    #spells-page {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 24px 28px 0;
      overflow: hidden;
    }

    .filter-bar {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 14px 20px; margin-bottom: 20px;
      background: #1d1810; border: 1px solid #3a2e18;
      border-radius: 10px; flex-shrink: 0;
    }

    .field { display: flex; align-items: center; gap: 7px; }
    .field label { font-size: 11px; color: #8a6838; white-space: nowrap; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
    .field select, .field input {
      background: #0f0e0b; border: 1px solid #4a3818; color: #f0e4c8;
      padding: 7px 12px; border-radius: 6px; font-size: 13px;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .field select:hover, .field input:hover { border-color: #6a5028; }
    .field select:focus, .field input:focus { border-color: #e8a82a; box-shadow: 0 0 0 3px rgba(232,168,42,0.15); outline: none; }
    .field input[type="text"] { width: 220px; }

    #spell-results {
      flex: 1; min-height: 0; overflow-y: auto;
      padding-bottom: 24px;
    }

    .spell-detail {
      background: #1d1810; border: 1px solid #3a2e18; border-radius: 10px;
      padding: 16px 20px; margin-bottom: 10px; cursor: pointer;
      transition: border-color 150ms, transform 150ms, box-shadow 150ms;
    }
    .spell-detail:hover { border-color: #5a4828; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.35); }
    .spell-detail h3 { color: #e8a82a; font-size: 15px; margin-bottom: 4px; }
    .spell-level { font-size: 12px; color: #8a6838; font-weight: 400; margin-left: 8px; }

    .spell-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .spell-header h3 { margin: 0; }
    .spell-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .spell-badge { font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
    .type-badge { background: rgba(232,168,42,0.12); color: #c8a450; border: 1px solid rgba(232,168,42,0.2); }
    .mana-badge { background: rgba(96,165,250,0.1); color: #7ab0e0; border: 1px solid rgba(96,165,250,0.2); }
    .skill-badge { background: rgba(160,140,100,0.1); color: #9a8060; border: 1px solid rgba(160,140,100,0.2); }
    .spell-desc { font-size: 13px; color: #b8a070; margin: 5px 0 6px; line-height: 1.45; font-style: italic; }
    .spell-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .stat-tag { font-size: 11px; color: #7a6848; background: #141210; border: 1px solid #2e2418; padding: 2px 8px; border-radius: 4px; }
    .vendor-list { margin-top: 10px; border-top: 1px solid #2e2418; padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .vendor-row { display: flex; gap: 8px; font-size: 13px; color: #9a8060; padding: 2px 0; }
    .zone-tag { color: #6a5438; }
    .vendor-hint { font-size: 12px; color: #5a4428; margin-top: 6px; }

    .no-results { color: #6a5438; font-style: italic; padding: 52px 0; text-align: center; font-size: 15px; }
    .loading    { color: #8a6838; padding: 52px 0; text-align: center; letter-spacing: 0.2em; font-size: 11px; text-transform: uppercase; }

    @media (max-width: 700px) {
      #spells-page { padding: 14px 16px 0; }
      .filter-bar { gap: 12px; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Spell Browser</p>
    </div>
    <nav style="margin-left:auto;display:flex;gap:8px;">
      <a class="nav-link" style="margin-left:0" href="index.html">Spell Finder</a>
      <a class="nav-link" style="margin-left:0" href="route.html">Route Finder</a>
    </nav>
  </header>

  <div id="spells-page">
    <div class="filter-bar">
      <div class="field">
        <label>Class</label>
        <select id="spell-class-select"></select>
      </div>
      <div class="field">
        <label>Level</label>
        <select id="spell-level-select">
          <option value="all">All Levels</option>
        </select>
      </div>
      <div class="field">
        <label>Search</label>
        <input type="text" id="spell-search" placeholder="spell name...">
      </div>
    </div>
    <div id="spell-results"></div>
  </div>

  <footer style="padding:10px 28px;border-top:1px solid #2a1e0c;font-size:11px;color:#4a3818;text-align:center;letter-spacing:0.04em;flex-shrink:0;">Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="spells.js"></script>
</body>
</html>
