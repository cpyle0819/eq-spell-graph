<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Spell Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    #spells-page {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 24px 28px 0;
      overflow: hidden;
    }

    .filter-bar {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 14px 20px; margin-bottom: 20px; flex-shrink: 0;
    }
    .field { display: flex; align-items: center; gap: 7px; }
    .field input[type="text"] { width: 220px; }

    #spell-results { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }

    .spell-detail { padding: 16px 20px; margin-bottom: 10px; }
    .spell-detail h3 { margin-bottom: 4px; }

    @media (max-width: 700px) {
      #spells-page { padding: 14px 16px 0; }
      .filter-bar { gap: 12px; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Spell Browser</p>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Spell Finder</a>
      <a class="nav-link" href="route.html">Route Finder</a>
      <a class="nav-link" href="class-browser.html">Class Browser</a>
    </nav>
  </header>

  <div id="spells-page">
    <div class="filter-bar">
      <div class="field">
        <label>Class</label>
        <select id="spell-class-select"></select>
      </div>
      <div class="field">
        <label>Level</label>
        <select id="spell-level-select">
          <option value="all">All Levels</option>
        </select>
      </div>
      <div class="field">
        <label>Search</label>
        <input type="text" id="spell-search" placeholder="spell name...">
      </div>
    </div>
    <div id="spell-results"></div>
  </div>

  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="spells.js"></script>
</body>
</html>
