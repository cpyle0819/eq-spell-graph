<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Classes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style id="page-style">
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    /* #class-browser-page is the console frame — flush against the header
       and viewport edges, matching the Spell Finder's #planner. Filters
       live in a left sidebar (<sidebar-panel>, shared with the Spell
       Finder — public/components/sidebar-panel.js) rather than a
       horizontal bar — a tag-input field that grows wider as chips are
       added would otherwise shift every field to its right; a sidebar's
       fields stack full-width instead, so adding a chip only grows a
       field downward within its own row. */
    #class-browser-page {
      display: flex; flex-direction: column; overflow: hidden; flex: 1;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      padding: 0 14px 14px; gap: 14px;
    }
    #browser-content { flex: 1; min-height: 0; overflow-y: auto; }

    /* No top padding — the first result's own border sits right up against
       the top of the console frame, same as the Spell Finder's first
       zone-card. */
    #browser-results { padding: 0 0 24px; }

    /* Packed edge-to-edge with a shared seam, same technique as the Spell
       Finder's zone-card list — a proper stone panel per row, not a gap
       between floating cards. Each category renders one card tag at a
       time (spell-card/aa-card/ability-card/stance-card,
       public/components/), so the adjacency only ever needs to match
       same-tag siblings, not a mixed list. */
    spell-card + spell-card, aa-card + aa-card,
    ability-card + ability-card, stance-card + stance-card { margin-top: -4px; }

    @media (min-width: 1100px) {
      #class-browser-page { flex-direction: row; align-items: flex-start; overflow: visible; padding: 0 0 14px 0; gap: 0; }
      /* No left padding — the sidebar's own right border is the seam
         shared with the first result's left border (console look), same
         as the Spell Finder's sidebar-panel/#results split. */
      #browser-content { overflow-y: auto; }
    }

    @media (max-width: 1099.98px) {
      body { height: auto; min-height: 100vh; }
      #class-browser-page { flex: none; overflow: visible; }
      #browser-content { flex: none; overflow-y: visible; min-height: 0; }
    }

    @media (max-width: 700px) {
      #class-browser-page { padding: 0 10px 10px; gap: 10px; }
    }
  </style>
</head>
<body>
  <app-header subtitle="Classes">
    <nav-links slot="nav" current="class-browser"></nav-links>
  </app-header>

  <div id="class-browser-page">
    <div id="controls-panel-slot"></div>
    <div id="browser-content">
      <div id="browser-results"></div>
    </div>
  </div>

  <app-footer></app-footer>
  <script type="module" src="router.js"></script>
</body>
</html>
