<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Class Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    #class-browser-page {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 24px 28px 0;
      overflow: hidden;
    }

    .filter-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 20px; margin-bottom: 20px; flex-shrink: 0; }
    .field select { min-width: 160px; }

    #browser-results { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }

    .ability-section-title {
      font-family: var(--font-display); color: var(--gold); font-size: 15px;
      letter-spacing: 0.08em; text-transform: uppercase; margin: 4px 0 14px;
    }
    .ability-section-title:not(:first-child) { margin-top: 28px; }

    .spell-detail { padding: 16px 20px; margin-bottom: 10px; }
    .spell-detail h3 { margin-bottom: 4px; }
    .class-badge { background: rgba(90, 60, 20, 0.08); color: #5a3c14; border: 1px solid rgba(90, 60, 20, 0.3); }

    @media (max-width: 700px) {
      #class-browser-page { padding: 14px 16px 0; }
      .filter-bar { gap: 12px; padding: 12px 16px; }
      .field select { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Class Browser</p>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Spell Finder</a>
      <a class="nav-link" href="spells.html">Spell Browser</a>
      <a class="nav-link" href="route.html">Route Finder</a>
    </nav>
  </header>

  <div id="class-browser-page">
    <div class="filter-bar">
      <div class="field">
        <label>Class 1</label>
        <select id="class-select-1"></select>
      </div>
      <div class="field">
        <label>Class 2</label>
        <select id="class-select-2"></select>
      </div>
      <div class="field">
        <label>Class 3</label>
        <select id="class-select-3"></select>
      </div>
    </div>
    <div id="browser-results"></div>
  </div>

  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="class-browser.js"></script>
</body>
</html>
