<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Class Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    /* #class-browser-page is the console frame — flush against the header
       and viewport edges, matching the Spell Finder's #planner. .filter-bar
       keeps its own pronounced bevel border (shared theme.css panel rule)
       for framing instead of the frame adding outer padding around it; a
       small gap (not zero) separates it from the tab bar/results below,
       same distinct-panels-get-a-gap reasoning as Route Finder's
       finder-bar/result split. */
    #class-browser-page {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--marble-tex), linear-gradient(180deg, var(--stone-1), var(--stone-2));
      padding: 0 0 14px; gap: 14px;
    }

    .filter-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 20px; flex-shrink: 0; }
    .field select { min-width: 160px; }
    .field input[type="text"] { width: 220px; }
    #reset-filters-btn { margin-left: auto; }

    #browser-results { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }

    /* Packed edge-to-edge with a shared seam, same technique as the Spell
       Finder's zone-card list — a proper stone panel per row, not a gap
       between floating cards. */
    .spell-detail { margin: 0; }
    .spell-detail + .spell-detail { margin-top: -4px; }
    .class-badge { background: rgba(90, 60, 20, 0.08); color: #5a3c14; border: 1px solid rgba(90, 60, 20, 0.3); }

    @media (max-width: 700px) {
      #class-browser-page { padding: 0 0 10px; gap: 10px; }
      .filter-bar { gap: 12px; padding: 12px 16px; }
      .field select { min-width: 0; flex: 1; }
      .tab-bar { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Class Browser</p>
    </div>
    <nav class="nav-links" id="nav-links"></nav>
  </header>

  <div id="class-browser-page">
    <div class="filter-bar">
      <div class="field">
        <label>Class 1</label>
        <select id="class-select-1"></select>
      </div>
      <div class="field">
        <label>Class 2</label>
        <select id="class-select-2"></select>
      </div>
      <div class="field">
        <label>Class 3</label>
        <select id="class-select-3"></select>
      </div>
      <div class="field" id="level-field" hidden>
        <label>Level</label>
        <select id="level-select">
          <option value="all">All Levels</option>
        </select>
      </div>
      <div class="field">
        <label>Search</label>
        <input type="text" id="browser-search" placeholder="name...">
      </div>
      <button type="button" class="text-action" id="reset-filters-btn">Reset filters</button>
    </div>
    <div id="browser-tabs" class="tab-bar" hidden></div>
    <div id="browser-results"></div>
  </div>

  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="components.js"></script>
  <script src="class-browser.js"></script>
</body>
</html>
