<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Route Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Page layout only — component styling lives in theme.css */
    body { height: 100vh; display: flex; flex-direction: column; }

    main {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 24px 28px;
      overflow: hidden;
    }

    .finder-bar {
      display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
      padding: 16px 20px; margin-bottom: 24px; flex-shrink: 0;
    }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
    .field select { width: 100%; }

    .arrow { color: var(--line-strong); font-size: 20px; padding-bottom: 8px; flex-shrink: 0; }

    #route-result { flex: 1; min-height: 0; overflow-y: auto; }

    .route-card { border-top: 2px solid var(--gold); padding: 22px 26px; }
    .route-card-header { margin-bottom: 18px; gap: 14px; }
    .route-path { padding: 14px 18px; }

    @media (max-width: 600px) {
      main { padding: 14px 16px; }
      .finder-bar { gap: 10px; padding: 14px 16px; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Route Finder</p>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Spell Finder</a>
      <a class="nav-link" href="spells.html">Spell Browser</a>
    </nav>
  </header>

  <main>
    <div class="finder-bar">
      <div class="field">
        <label>From</label>
        <select id="route-from"><option value="">— Select Zone —</option></select>
      </div>
      <span class="arrow">›</span>
      <div class="field">
        <label>To</label>
        <select id="route-to"><option value="">— Select Zone —</option></select>
      </div>
    </div>
    <div id="route-result"></div>
  </main>

  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="route.js"></script>
</body>
</html>
