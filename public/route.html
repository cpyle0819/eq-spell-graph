<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norraph — Route Finder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #141210;
      color: #f0e4c8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    header {
      padding: 14px 28px;
      background: #1a1610;
      border-bottom: 1px solid #3a2e18;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header-title { display: flex; flex-direction: column; gap: 3px; }
    header h1 { font-size: 22px; font-weight: 800; color: #e8a82a; letter-spacing: -0.01em; }
    .header-sub { font-size: 11px; color: #6a5438; letter-spacing: 0.18em; text-transform: uppercase; }

    .nav-links { margin-left: auto; display: flex; gap: 8px; }
    .nav-link {
      padding: 8px 18px; background: transparent;
      border: 1px solid #3a2e18; border-radius: 6px;
      font-size: 12px; color: #8a6838; text-decoration: none;
      letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500;
      transition: all 150ms ease-out;
    }
    .nav-link:hover { border-color: #5a4828; color: #c8a860; background: rgba(200,168,42,0.06); }
    .nav-link:focus-visible { outline: 2px solid #e8a82a; outline-offset: 2px; }

    main {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 24px 28px;
      overflow: hidden;
    }

    .finder-bar {
      display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
      padding: 16px 20px; margin-bottom: 24px;
      background: #1d1810; border: 1px solid #3a2e18;
      border-radius: 10px; flex-shrink: 0;
    }

    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
    .field label { font-size: 11px; color: #8a6838; white-space: nowrap; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
    .field select {
      background: #0f0e0b; border: 1px solid #4a3818; color: #f0e4c8;
      padding: 7px 12px; border-radius: 6px; font-size: 13px;
      transition: border-color 150ms, box-shadow 150ms; width: 100%;
    }
    .field select:hover { border-color: #6a5028; }
    .field select:focus { border-color: #e8a82a; box-shadow: 0 0 0 3px rgba(232,168,42,0.15); outline: none; }

    .arrow { color: #4a3818; font-size: 20px; padding-bottom: 8px; flex-shrink: 0; }


    #route-result { flex: 1; min-height: 0; overflow-y: auto; }

    .route-card {
      background: #1d1810; border: 1px solid #3a2e18; border-top: 2px solid #e8a82a;
      border-radius: 10px; padding: 22px 26px;
    }
    .route-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .route-card-title { font-size: 20px; font-weight: 700; color: #f0e4c8; }
    .hops-badge {
      font-size: 12px; padding: 3px 10px; border-radius: 20px;
      background: #141210; border: 1px solid #3a2e18; color: #b89050;
    }

    .route-path {
      padding: 14px 18px; border-radius: 8px;
      background: rgba(232,168,42,0.07); border: 1px solid rgba(232,168,42,0.18);
    }
    .route-label {
      display: block; font-size: 10px; color: #8a6838;
      letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px;
    }
    .route-steps { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-size: 14px; line-height: 2.2; }
    .route-zone { color: #c8a860; font-weight: 500; }
    .route-sep { color: #e8a82a; margin: 0 6px; font-weight: 700; }
    .boat-sep, .translocator-sep { cursor: help; }
    .boat-sep { color: #60a5fa; margin: 0 8px; font-size: 16px; }
    .translocator-sep { color: #c77dff; margin: 0 8px; font-size: 16px; }

    .no-results { color: #6a5438; font-style: italic; padding: 52px 0; text-align: center; font-size: 15px; }
    .loading    { color: #8a6838; padding: 52px 0; text-align: center; letter-spacing: 0.2em; font-size: 11px; text-transform: uppercase; }

    footer {
      padding: 10px 28px; border-top: 1px solid #2a1e0c; flex-shrink: 0;
      font-size: 11px; color: #4a3818; text-align: center; letter-spacing: 0.04em;
    }
    footer a { color: #c8a860; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      main { padding: 14px 16px; }
      .finder-bar { gap: 10px; padding: 14px 16px; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1>Norraph</h1>
      <p class="header-sub">Route Finder</p>
    </div>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Spell Finder</a>
      <a class="nav-link" href="spells.html">Spell Browser</a>
    </nav>
  </header>

  <main>
    <div class="finder-bar">
      <div class="field">
        <label>From</label>
        <select id="route-from"><option value="">— Select Zone —</option></select>
      </div>
      <span class="arrow">›</span>
      <div class="field">
        <label>To</label>
        <select id="route-to"><option value="">— Select Zone —</option></select>
      </div>
    </div>
    <div id="route-result"></div>
  </main>

  <footer>Unofficial fan-made tool. EverQuest® and EverQuest Legends™ are trademarks of Daybreak Game Company LLC. Not affiliated with or endorsed by Daybreak. · <a href="https://github.com/cpyle0819/eq-spell-graph" target="_blank" rel="noopener">Contribute on GitHub</a></footer>
  <script src="route.js"></script>
</body>
</html>
