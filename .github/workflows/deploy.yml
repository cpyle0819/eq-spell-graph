name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run typecheck
      - run: bun run build:lambda

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::754692068426:role/norraph-github-actions-deploy
          aws-region: us-east-1

      - run: aws lambda update-function-code --function-name norraph-api --zip-file fileb://dist-lambda.zip

      - run: aws s3 sync public/ s3://coreypyle.com/norraph/ --delete
      - run: aws s3 sync public/ s3://norraph.com/ --delete

      - run: aws cloudfront create-invalidation --distribution-id E3P5BMNQ3CTQT6 --paths '/norraph/*'
      - run: aws cloudfront create-invalidation --distribution-id EAN2LIQ87OXOJ --paths '/*'
