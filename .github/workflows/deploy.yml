name: Notify deploy pipeline

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy event to infra repo
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api repos/cpyle0819/coreypyle-infra/dispatches \
            -f event_type=deploy-norraph \
            -f "client_payload[sha]=${{ github.sha }}"
